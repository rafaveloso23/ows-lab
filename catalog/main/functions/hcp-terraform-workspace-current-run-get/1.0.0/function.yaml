# Read-only; retries transient HTTP failures. Requires HCP_TERRAFORM_TOKEN.
do:
- get:
    try:
    - request:
        call: http
        with:
          method: get
          endpoint:
            uri: ${ "https://app.terraform.io/api/v2/workspaces/\(.workspace_id)" }
            authentication:
              bearer:
                use: HCP_TERRAFORM_TOKEN
          headers:
            accept: application/vnd.api+json
    catch:
      when: ${ .status == 408 or .status == 429 or .status == 500 or .status == 502 or .status == 503 or .status == 504 }
      retry:
        delay:
          seconds: 1
        backoff:
          exponential: {}
        limit:
          attempt:
            count: 3
- validate:
    switch:
    - valid:
        when: ${ .data.type == "workspaces" and (.data.id | type) == "string" and (.data.relationships | has("current-run"))
          }
        then: result
    - invalid:
        then: invalid-response
- invalid-response:
    raise:
      error:
        type: https://example.com/errors/terraform-run
        status: 502
        title: Invalid Terraform API response
        detail: ${ "Response does not match the expected resource" }
- result:
    set:
      value: '${ {workspace_id: .data.id, run_id: .data.relationships["current-run"].data.id, latest_run_id: .data.relationships["latest-run"].data.id,
        no_code: (.data.relationships["no-code-module-version"].data.id != null)} }'
    output:
      as: ${ .value }
